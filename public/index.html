<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bitácora · Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233987e5'/%3E%3Cpath d='M8 21l5-6 4 3 7-9' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/estilos.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="lateral" id="lateral">
      <a class="marca" href="#resumen" aria-label="Bitácora">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--serie-1)"/><path d="M8 21l5-6 4 3 7-9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Bitácora</span>
      </a>
      <nav aria-label="Secciones">
        <a href="#resumen" data-t="nav.resumen"></a>
        <a href="#seccion-cuentas" data-t="nav.cuentas"></a>
        <a href="#eventos" data-t="nav.eventos"></a>
        <a href="#distribucion" data-t="nav.distribucion"></a>
        <a href="#evolucion" data-t="nav.evolucion"></a>
        <a href="#calendario" data-t="nav.calendario"></a>
      </nav>
    </aside>

    <div class="principal">
      <header class="barra">
        <button class="icono" type="button" data-accion="lateral" data-t-aria="barra.lateral">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
        </button>
        <span class="espaciador"></span>
        <button class="icono texto" type="button" data-accion="idioma" data-t-aria="barra.idioma" id="boton-idioma"></button>
        <button class="icono" type="button" data-accion="tema" data-t-aria="barra.tema">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        </button>
        <button class="icono" type="button" data-accion="pantalla" data-t-aria="barra.pantalla">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
        <details class="menu">
          <summary class="icono" data-t-aria="barra.opciones">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
          </summary>
          <div class="menu-lista">
            <button type="button" data-accion="demo" data-t="opciones.demo"></button>
            <button type="button" class="peligro" data-accion="restablecer" data-t="opciones.restablecer"></button>
          </div>
        </details>
      </header>

      <main class="contenido">
        <div class="encabezado" id="resumen">
          <div>
            <h1 data-t="titulo"></h1>
            <p class="apagado" data-t="subtitulo"></p>
          </div>
          <button class="boton primario" type="button" data-accion="nueva-cuenta">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            <span data-t="agregarCuenta"></span>
          </button>
        </div>

        <section id="primer-uso" hidden></section>
        <section id="kpis" class="kpis" aria-live="polite"></section>
        <section id="seccion-cuentas" hidden></section>
        <section id="eventos" class="tarjeta"></section>

        <div class="dos-columnas">
          <section id="distribucion" class="tarjeta"></section>
          <section id="top" class="tarjeta"></section>
        </div>

        <section id="evolucion" class="tarjeta"></section>
        <section id="calendario" class="tarjeta sin-relleno"></section>
      </main>
    </div>
  </div>

  <dialog id="dialogo"></dialog>
  <div id="avisos" class="avisos" role="status" aria-live="polite"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
